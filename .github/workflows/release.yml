name: release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease
          - custom
      new-version:
        description: Explicit semantic version for custom, such as 0.1.0 (no leading v)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: go-bump-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - run: make all

      - id: release
        uses: $/
        with:
          version-type: ${{ inputs.version-type }}
          new-version: ${{ inputs.new-version }}
          github-token: ${{ github.token }}
          pre-publish: make all
          seed-proxy: false
          major-branch: true

      - name: Verify credentials were not persisted
        shell: bash
        run: |
          set -euo pipefail
          remote_url=$(git remote get-url origin)
          case "$remote_url" in
            *x-access-token*|*github_pat_*|*ghp_*|*ghs_*)
              echo 'A credential-bearing remote URL was persisted' >&2
              exit 1
              ;;
          esac
          if git config --local --get-regexp '^(credential\.|http\..*\.extraheader)' >/dev/null; then
            echo 'A local Git credential setting was persisted' >&2
            exit 1
          fi
          if grep -E 'x-access-token|github_pat_|ghp_|ghs_' .git/config >/dev/null; then
            echo 'A credential was persisted in .git/config' >&2
            exit 1
          fi

      - name: Release summary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          MAJOR_BRANCH: ${{ steps.release.outputs.major-branch }}
        run: echo "Published $RELEASE_TAG and updated $MAJOR_BRANCH"
